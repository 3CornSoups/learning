# =============================================================================
# MiniMax-H3 T2AV SGMD LoRA 阶段 2 正式训练（高分辨率 + 长时长）
# =============================================================================
# Optional warm start: set MINIMAX_H3_INIT_STUDENT_CHECKPOINT to a repair checkpoint.
# 超参沿用 repair 验证过的收紧配置（非早期崩掉的 formal 配置）。
# Launch command depends on the complete upstream training checkout.
# =============================================================================

model:
    name: minimax_h3_t2av
    pretrained_model_name_or_path: ${oc.env:MINIMAX_H3_MODEL_PATH}
    running_dtype: bf16
    transformer_param_dtype: bf16
    local_files_only: true
    patch_size: [1, 2, 2]
    video_latent_channels: 24
    audio_latent_channels: 32
    vae_spatial_scale_factor: 16
    attention_backend: _native_flash

distributed:
    backend: nccl
    timeout_minutes: 60
    sequence_parallel:
        enabled: false
        size: 1
    fsdp2:
        enabled: true
        size: ${oc.env:WORLD_SIZE,1}
        reshard_after_forward:
            root_reshard: true
            block_reshard: true
        mixed_precision:
            param_dtype: null
            reduce_dtype: fp32
            output_dtype: null
            cast_forward_inputs: false

data:
    train:
        name: latent_dataset
        data_path: ${oc.env:MINIMAX_H3_PROMPT_CACHE}
        batch_size: 1
        num_workers: 2
        pin_memory: true
        shuffle: true
        drop_last: false

scheduler:
    num_train_timesteps: 1000
    timestep_distribution: uniform
    min_t: 0.001
    max_t: 1.0

training:
    method: minimax_h3_t2av_sgmd
    max_train_iters: 3000
    gradient_accumulation_iters: 2
    gradient_checkpointing: true
    max_grad_norm: 1.0
    lr_scheduler: constant
    lr_warmup_iters: 200
    save_every_iters: 100
    save_total_limit: 10
    minimax_h3:
        video_flow_shift: 6.0
        audio_flow_shift: 3.0
        video_loss_weight: 1.0
        audio_loss_weight: 1.0
        # bf16 latent 显著省显存；大画布正式训练优先可跑通
        latent_dtype: bf16
    sgmd:
        fake_correction_weight: 0.05
    dmd:
        num_inference_steps: 4
        fake_update_ratio: 1
        # 阶段 2 正式画布：704×1280×209（≈8.7s @24fps，17n+5）
        height: 704
        width: 1280
        num_frames: 209
        renoise_sigma_min: 0.02
        renoise_sigma_max: 0.98
        warp_denoising_step: false
    student:
        train_type: lora
        # 从 repair ckpt1400 初始化 student LoRA（仅 safetensors，避免 dist_state OOM）
        checkpoint_path: ${oc.env:MINIMAX_H3_INIT_STUDENT_CHECKPOINT}
        checkpoint_strict: false
        lora:
            rank: 128
            alpha: 128
            target_modules:
                - to_q
                - to_k
                - to_v
                - to_out.0
                - ff.net.0.proj
                - ff.net.2
        optimizer:
            learning_rate: 0.00003
            adam_beta1: 0.9
            adam_beta2: 0.999
            weight_decay: 0.01
            adam_epsilon: 0.00000001
    fake:
        train_type: lora
        lora:
            rank: 128
            alpha: 128
            target_modules:
                - to_q
                - to_k
                - to_v
                - to_out.0
                - ff.net.0.proj
                - ff.net.2
        optimizer:
            learning_rate: 0.00001
            adam_beta1: 0.9
            adam_beta2: 0.999
            weight_decay: 0.01
            adam_epsilon: 0.00000001
    teacher:
        guidance_scale: 1.0
        cfg_norm: none
    output_dir: ./outputs/sgmd_phase2

inference:
    method: none
    infer_every_iters: null

logging:
    rank_zero_only: true
    train_log_every_iters: 10
    wandb:
        enable: true
        project: minimax-h3-sgmd
        name: h3-t2av-sgmd-formal-704x1280x209
        group: formal-phase2
        tags:
            - minimax-h3
            - sgmd
            - lora
            - formal
            - phase2

resume:
    auto_resume: true
