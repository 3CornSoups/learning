[project]
name = "douyin-local-crawler"
version = "0.1.0"
description = "Discover public Douyin videos with a locally logged-in browser"
requires-python = ">=3.10"
dependencies = ["httpx>=0.28,<0.29", "playwright>=1.56,<2"]

[project.optional-dependencies]
verify = ["opencv-python>=4.10,<5"]

[dependency-groups]
server = ["httpx>=0.28,<0.29"]
remote_browser = ["playwright>=1.56,<2", "websockify>=0.13,<1"]
